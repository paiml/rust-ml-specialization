<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="st sd">
<title id="st">The CPU and Crypto Ceiling</title>
<desc id="sd">Title slide for the lesson "The CPU and Crypto Ceiling" in the module Module 2 — Finding the Bottleneck.</desc>
<!-- GRID PROTOCOL MANIFEST
     Canvas: 1920x1080 | Grid: 16x9 | Cell: 120px
     Template: title-card | Theme: oxide
     Step 1: "title" (1,3)->(14,4) 120,360 -> 1800,600 28 cells
     Step 2: "subtitle" (2,5)->(13,5) 240,600 -> 1680,720 12 cells
     TOTAL: 40/144 cells | 0 overlaps
-->

<defs>
  <style>
    .h { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .m { font-family: 'Cascadia Code', 'Fira Code', monospace; }
    .label { font-family: 'Segoe UI', sans-serif; letter-spacing: 0.12em; }
  </style>

  <!-- VQ: ambient background -->
  <radialGradient id="bg" cx="50%" cy="40%" r="75%">
    <stop offset="0%" stop-color="#1e2240"/>
    <stop offset="100%" stop-color="#0e0e1a"/>
  </radialGradient>
  <!-- VQ: hex grid texture -->
  <pattern id="hex" width="60" height="52" patternUnits="userSpaceOnUse">
    <path d="M30 0 L60 15 L60 37 L30 52 L0 37 L0 15 Z" fill="none" stroke="#fff" stroke-width="0.4" opacity="0.04"/>
  </pattern>
  <!-- VQ: ambient color zones -->
  <radialGradient id="zone-warm" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ff8fa3" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ff8fa3" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="zone-cool" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#a9dc76" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#a9dc76" stop-opacity="0"/>
  </radialGradient>
  <!-- VQ: accent bars (divider + section top-edges) -->
  <linearGradient id="bar-rust" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff9966"/>
    <stop offset="100%" stop-color="#78dce8"/>
  </linearGradient>
  <linearGradient id="divider-g" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff9966" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#78dce8" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#ff9966" stop-opacity="0.8"/>
  </linearGradient>
  <!-- VQ: depth shadow for cards/icons -->
  <filter id="depth-shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
  </filter>
</defs>

<!-- BACKGROUND -->
<rect width="1920" height="1080" fill="url(#bg)"/>
<rect width="1920" height="1080" fill="url(#hex)"/>

<!-- AMBIENT COLOR ZONES -->
<ellipse cx="480" cy="450" rx="520" ry="420" fill="url(#zone-warm)"/>
<ellipse cx="1440" cy="450" rx="520" ry="420" fill="url(#zone-cool)"/>

<!-- SLOT PLACEHOLDERS (filled by /svg-fill) -->
<g id="slot-title" opacity="1"><text class="h" x="960" y="480" font-size="96" font-weight="700" fill="#f8fafc" text-anchor="middle" dominant-baseline="middle">The CPU and Crypto Ceiling</text></g>
<g id="slot-subtitle" opacity="0"><text class="label" x="960" y="662" font-size="40" fill="#cdd6f4" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.12em">Module 2 — Finding the Bottleneck</text></g>
</svg>
