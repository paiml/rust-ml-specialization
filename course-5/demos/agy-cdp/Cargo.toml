[package]
name = "agy-cdp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The course's closed CDP client for the Antigravity app; the only crate that may hold a WebSocket. Bin e3-probe is the ph4 entry gate."

[lib]
path = "src/lib.rs"

[[bin]]
name = "e3-probe"
path = "src/main.rs"

[dependencies]
base64.workspace = true
rustix.workspace = true
serde_json.workspace = true
tungstenite.workspace = true
