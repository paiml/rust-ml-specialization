[workspace]
resolver = "2"
members = ["d01-serve-hello", "d02-cold-vs-resident", "d04-json-verdict", "d07-quorum", "d08-planted-defect", "d09-parity-receipt", "d11-refusals", "d13-reducer", "d15-agy-teamwork", "d16-kaizen", "demo-kit", "xtask"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
