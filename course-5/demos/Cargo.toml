[workspace]
resolver = "2"
members = ["demo-kit", "xtask", "d13-reducer", "d01-serve-hello", "d02-cold-vs-resident", "d09-parity-receipt"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
libc = "0.2"
