id = "d08-planted-defect"
title = "Planted-defect sweep: agy + claude lanes over a budget-sized corpus subset"
lesson = "rfml5/5.1"
apr = "=0.69.3"
agy = "=1.2.11"
host_class = "any"
needs = ["agy", "claude"]
fixtures = { dir = "../fixtures/diffs", sha256 = "cbf5e4ec47ad9ffc0fcc2c4213afdfee25943f4e9dd7918976178b4c521aa458" }

[[step]]
cmd = "cargo run -q -p d08-planted-defect"

[assert]
n = ">= 4"
balanced = true
lanes_run = 2
apr_lane = "NotRun{Refused(--json-schema)}"
# Floors set from three real runs on n=4 (2 clean + 2 planted: clean-01,
# clean-02, planted-01, planted-02), recorded in the W-3 inbox report, never
# tuned to a single run: the minimum observed value across all three, so a
# fourth run below what was already measured is a real regression.
#   run 1: recall 1.00/1.00  precision 1.00/1.00 (agy/claude)
#   run 2: recall 1.00/1.00  precision 1.00/1.00
#   run 3: recall 1.00/1.00  precision 1.00/1.00
# clean-01.diff previously read as ambiguous (both lanes FAILed it every
# run) and was replaced (word-count helpers with an inline unit test, no
# plausible defect in any MANIFEST class); with that fixed, all three runs
# show perfect recall and precision. agy twice returned a response with no
# structured_output field on a clean diff (a real agy reliability wrinkle,
# not a fixture problem — see the W-3 report); that lane is scored as
# NotRun, not a false positive, and did not affect these numbers.
recall_agy = ">= 1.0"
recall_claude = ">= 1.0"
precision_agy = ">= 1.0"
precision_claude = ">= 1.0"
# A recall over zero scored planted diffs is not a measurement.
scored_planted_agy = ">= 1"
scored_planted_claude = ">= 1"
exit = 0

[record]
target_duration_s = 280
resolution = "1920x1080"
terminal = { font_pt = "[U]", cols = 100, theme = "rendition-skin" }
narration_may_cite = ["n", "recall_agy", "recall_claude", "precision_agy", "precision_claude", "apr_lane", "notrun_agy", "notrun_claude"]
