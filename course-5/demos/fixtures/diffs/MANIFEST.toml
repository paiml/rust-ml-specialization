# Corpus manifest for MEGA-001 W-3 (planted-defect-corpus-v1).
#
# 10 clean + 10 planted-defect unified diffs of small Rust changes. Every
# entry here must have exactly one matching file in this directory and
# every file in this directory must have exactly one entry here (a
# bijection) — checked by d08-planted-defect's corpus test.
#
# `marker_line` is the 1-based line number **within the .diff file itself**,
# not a line number in some reconstructed source tree — these diffs are fed
# to review lanes (agy, claude) as opaque unified-diff text, never applied
# with `patch`, so "line N" means line N of the diff text as the reviewer
# reads it. `marker_text` is that line's exact content (including its
# leading `+`); the corpus test asserts
# `lines(file)[marker_line - 1] == marker_text` for every planted file, and
# a mutation test proves that deleting that line turns the check RED.
#
# The marker text is never a comment calling out the bug — a reviewer has to
# find the defect from the code, not from a label.

