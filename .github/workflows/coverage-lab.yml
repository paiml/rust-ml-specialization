# Nightly line-coverage measurement. It never runs on a pull request or a push
# and no other job depends on it. A red run opens or updates one issue.
name: coverage-lab

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage-demos-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            course-5/demos/target
          key: cov-demos-${{ runner.os }}-${{ hashFiles('course-5/demos/Cargo.lock', 'rust-toolchain.toml') }}
      # The demos' tests shell out to both tools; a missing tool fails, never skips.
      - name: Install shellcheck 0.10.0
        run: |
          curl -sfL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo install shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Cache bashrs
        id: bashrs-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/bashrs
          key: bashrs-7.4.1
      - name: Install bashrs 7.4.1
        if: steps.bashrs-cache.outputs.cache-hit != 'true'
        run: cargo install bashrs --version 7.4.1 --locked
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-llvm-cov@0.8.5
      - name: Coverage
        working-directory: course-5/demos
        run: cargo llvm-cov --workspace --summary-only

  coverage-lab-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            course-5/lab/practice/target
          key: cov-lab-${{ runner.os }}-${{ hashFiles('course-5/lab/practice/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: taiki-e/install-action@v2.87.32
        with:
          tool: cargo-llvm-cov@0.8.5
      - name: Coverage
        working-directory: course-5/lab/practice
        run: cargo llvm-cov --summary-only

  report-red:
    name: report-red
    needs: [coverage-demos-report, coverage-lab-report]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Open or update the coverage issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --search "coverage-lab in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Still red: $RUN_URL"
          else
            gh issue create --title "coverage-lab: nightly coverage run is red" --body "Nightly coverage run failed: $RUN_URL"
          fi
