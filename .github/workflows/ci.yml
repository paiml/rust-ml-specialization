name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, mega-001-integration]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown
        run: make lint

      - name: Validate course structure
        run: make test

  course-5-demos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-5/demos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (includes the demo-pin-v1, demo-refusal-not-green-v1, demo-contract-docstring-v1 falsifiers)
        run: cargo test --workspace

      - name: Verify every demo
        run: cargo run -q -p xtask -- verify

  # The org "Green Main" ruleset requires one status named `gate`. It passes
  # only when every job above passed; a skipped or cancelled job is a failure.
  gate:
    if: always()
    needs: [check, course-5-demos]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          test "${{ needs.check.result }}" = success
          test "${{ needs.course-5-demos.result }}" = success
