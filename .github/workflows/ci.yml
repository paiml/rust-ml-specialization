name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, mega-001-integration]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint markdown
        run: make lint

      - name: Validate course structure
        run: make test

  course-5-demos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-5/demos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable

      # Pinned: verify and the D14 falsifier shell out to both. A missing tool fails, never skips.
      - name: Install shellcheck 0.10.0
        run: |
          curl -sfL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo install shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: Cache bashrs
        id: bashrs-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bashrs
          key: bashrs-7.4.1

      - name: Install bashrs 7.4.1
        if: steps.bashrs-cache.outputs.cache-hit != 'true'
        run: cargo install bashrs --version 7.4.1 --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (includes the demo-pin-v1, demo-refusal-not-green-v1, demo-contract-docstring-v1 falsifiers)
        run: cargo test --workspace

      - name: Verify every demo
        run: cargo run -q -p xtask -- verify

  # The course 5 lab: the practice crate is tested and every exercise run; the
  # assignment skeleton is only built, because its `todo!()`s panic by design.
  course-5-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - name: Practice
        working-directory: course-5/lab/practice
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          for b in d18_one_server d19_mini_judge d21_fan_in; do cargo run -q --bin "$b"; done
      - name: Assignment skeleton builds
        working-directory: course-5/lab/assignment
        run: |
          cargo fmt --all -- --check
          cargo build --tests --bins

  # Not in `gate` yet: `pmat comply` fails today on repo-level checks (branch
  # protection, deny.toml, TDG grade) that need a ruling. It runs and reports.
  pmat-comply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cache pmat
        id: pmat-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/pmat
          key: pmat-3.42.0
      - name: Install pmat 3.42.0
        if: steps.pmat-cache.outputs.cache-hit != 'true'
        run: cargo install pmat --version 3.42.0 --locked
      - name: pmat comply
        env:
          GH_TOKEN: ${{ github.token }}
        run: pmat comply check

  # The org "Green Main" ruleset requires one status named `gate`. It passes
  # only when every job above passed; a skipped or cancelled job is a failure.
  gate:
    if: always()
    needs: [check, course-5-demos, course-5-lab]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          test "${{ needs.check.result }}" = success
          test "${{ needs.course-5-demos.result }}" = success
          test "${{ needs.course-5-lab.result }}" = success
